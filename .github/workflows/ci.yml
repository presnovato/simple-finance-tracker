name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check finance_bot tests tools
      - run: python -m coverage run -m pytest -q
      - run: python -m coverage report

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks-action@v2 работает на Node 20, который GitHub выводит из
      # эксплуатации; v3 — актуальная версия. Для личного аккаунта лицензия
      # GITLEAKS_LICENSE не требуется.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tma:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tma
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tma/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: tma/dist is fresh
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain -- tma/dist)" ]; then
            echo 'tma/dist is stale: run "npm run build" in tma/ and commit tma/dist together with the sources'
            git status -- tma/dist
            exit 1
          fi
